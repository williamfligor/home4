# macOS-only configuration, auto-loaded by auto_env ({os} = macos).
#
# Apps and fonts are Homebrew casks, installed without Homebrew. brew:ruby serves
# the Orca and Sheprd vendor taps, so a bare machine needs two `mise bootstrap`
# runs; casks are current-version only, hence no app pins in mise.lock.

[bootstrap.packages]
"brew:ruby" = { os = "macos" }

"brew-cask:ghostty" = { adopt = true, appdir = "~/Applications", os = "macos" }
"brew-cask:herdr-app" = { adopt = true, appdir = "~/Applications", os = "macos" }
"brew-cask:jordanbaird-ice" = { adopt = true, appdir = "~/Applications", os = "macos" }
"brew-cask:rectangle" = { adopt = true, appdir = "~/Applications", os = "macos" }
"brew-cask:stats" = { adopt = true, appdir = "~/Applications", os = "macos" }
"brew-cask:stablyai/orca/orca" = { adopt = true, appdir = "~/Applications", os = "macos" }
"brew-cask:sheprd-labs/tap/sheprd" = { adopt = true, appdir = "~/Applications", os = "macos" }

"brew-cask:font-jetbrains-mono-nerd-font" = { os = "macos" }
"brew-cask:font-symbols-only-nerd-font" = { os = "macos" }

# macOS-only dotfiles.

[dotfiles]

[dotfiles."~/.config/ghostty"]
source = "dot-config/ghostty"
mode = "symlink"

[dotfiles."~/.orca/keybindings.json"]
source = "dot-orca/keybindings.json"
mode = "symlink"
