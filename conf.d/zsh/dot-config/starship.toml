# Starship prompt: a framed two-line prompt with the directory and Git state on
# the first line, and the exit status, duration and prompt character below.
# Colours are xterm-256 values, written as hex.

"$schema" = "https://starship.rs/config-schema.json"

format = """[╭─](bold #6c6c6c)$directory$git_branch$git_status$fill$status$cmd_duration$line_break[╰─](bold #6c6c6c)$character"""

# No blank line above the prompt, to keep the transcript compact.
add_newline = false

# ✔ / ✘ sit on the right; both states are drawn, not just failures.
[status]
disabled = false
format = "[$symbol]($style)"
symbol = "✘ "
style = "bold #d70000"
success_symbol = "✔ "
success_style = "bold #5fd700"

# Only report commands that took a noticeable amount of time ("took 4s").
[cmd_duration]
min_time = 3000
show_milliseconds = false
format = "[took $duration]($style)"
style = "bold #a8a8a8"

[directory]
style = "#0087af"
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false

# "on main": branch names in green, the preposition and any tag/commit in grey.
[git_branch]
symbol = ""
format = "[on ](bold #a8a8a8)[$branch]($style)"
style = "bold #5fd700"
truncation_length = 32
truncation_symbol = "…"

# One symbol per state instead of starship's bracketed default. Counts are always
# shown rather than collapsing to a single marker.
[git_status]
style = "bold #d7af00"
format = "$all_status$ahead_behind"
conflicted = "[ ~$count](bold #d70000)"
stashed = "[ *$count](bold #5fd700)"
deleted = "[ ✘$count](bold #d70000)"
renamed = "[ »$count](bold #d7af00)"
modified = "[ !$count](bold #d7af00)"
staged = "[ +$count](bold #d7af00)"
untracked = "[ ?$count](bold #0087af)"
ahead = "[ ⇡$count](bold #5fd700)"
behind = "[ ⇣$count](bold #5fd700)"
diverged = "[ ⇕⇡$ahead_count⇣$behind_count](bold #5fd700)"

[fill]
symbol = " "

# ❯ when the last command succeeded, ❯ in red when it failed, and the vi-mode
# variants while zsh's keymap is not in insert mode.
[character]
success_symbol = "[❯](bold #5fd700)"
error_symbol = "[❯](bold #ff0000)"
vimcmd_symbol = "[❮](bold #5fd700)"
vimcmd_replace_symbol = "[V](bold #5fd700)"
vimcmd_replace_one_symbol = "[V](bold #5fd700)"
vimcmd_visual_symbol = "[V](bold #5fd700)"
