# What zsh needs from mise: the prompt, three plugins, and the dotfile links.
# One section per entry; upstream tarballs all wrap their contents in a directory,
# hence strip_components.

[tools]

# Pinned by commit: oh-my-zsh publishes no usable release tags.
[tools."http:oh-my-zsh"]
version = "0.0.1"
url = "https://github.com/ohmyzsh/ohmyzsh/archive/62afbdebb96bf91c044a92b75d86f85a67da67a7.zip"
strip_components = 1

[tools."http:zsh-syntax-highlighting"]
version = "0.8.0"
url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/tags/{{ version }}.tar.gz"
strip_components = 1

[tools."http:zsh-you-should-use"]
version = "1.11.1"
url = "https://github.com/MichaelAquilina/zsh-you-should-use/archive/refs/tags/{{ version }}.tar.gz"
strip_components = 1

# The only floating version here: p10k publishes releases, so `latest` resolves
# through the GitHub API instead of a tag convention.
[tools."http:powerlevel10k"]
version = "latest"
url = "https://github.com/romkatv/powerlevel10k/archive/v{{ version }}.tar.gz"
strip_components = 1
version_list_url = "https://api.github.com/repos/romkatv/powerlevel10k/releases/latest"
version_json_path = ".tag_name"

[dotfiles]

# Symlinks for the files this repo owns; copies for the two entry points the user
# is expected to edit in place.
[dotfiles."~/.config/zsh"]
source = "dot-config/zsh"
mode = "symlink"

[dotfiles."~/.p10k.zsh"]
source = "dot-p10k.zsh"
mode = "symlink"

[dotfiles."~/.zshenv"]
source = "dot-zshenv"
mode = "copy"

[dotfiles."~/.zshrc"]
source = "dot-zshrc"
mode = "copy"

[dotfiles."~/.zshrc.d"]
source = "dot-zshrc.d"
mode = "symlink"
