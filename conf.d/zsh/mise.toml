# What zsh needs from mise: the prompt binary, three plugins, and the dotfile
# links. One section per entry; upstream tarballs all wrap their contents in a
# directory, hence strip_components.

[tools]

# The prompt. The registry entry resolves to aqua:starship/starship, so there is
# no release URL to track here. ~/.config/starship.toml carries the styling.
starship = "latest"

# Pinned by commit: oh-my-zsh publishes no usable release tags.
[tools."http:oh-my-zsh"]
version = "0.0.1"
url = "https://github.com/ohmyzsh/ohmyzsh/archive/62afbdebb96bf91c044a92b75d86f85a67da67a7.zip"
strip_components = 1

[tools."http:zsh-syntax-highlighting"]
version = "0.8.0"
url = "https://github.com/zsh-users/zsh-syntax-highlighting/archive/refs/tags/{{ version }}.tar.gz"
strip_components = 1

[tools."http:zsh-you-should-use"]
version = "1.11.1"
url = "https://github.com/MichaelAquilina/zsh-you-should-use/archive/refs/tags/{{ version }}.tar.gz"
strip_components = 1

[dotfiles]

# Symlinks for the files this repo owns; copies for the two entry points the user
# is expected to edit in place.
[dotfiles."~/.config/zsh"]
source = "dot-config/zsh"
mode = "symlink"

[dotfiles."~/.config/starship.toml"]
source = "dot-config/starship.toml"
mode = "symlink"

[dotfiles."~/.zshenv"]
source = "dot-zshenv"
mode = "copy"

[dotfiles."~/.zshrc"]
source = "dot-zshrc"
mode = "copy"

[dotfiles."~/.zshrc.d"]
source = "dot-zshrc.d"
mode = "symlink"
