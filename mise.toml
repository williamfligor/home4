# Global mise configuration for williamfligor/home4.
# Bundle layout and source resolution are documented in README.md.

# Floor for `mise bootstrap --adopt`. Do not lower: brew-cask `appdir` needs 2026.10.0.
min_version = "2026.11.14"

[settings]
go_set_gobin = true
dotfiles.default_mode = "symlink"
# mise updates itself: checked daily, installed before the next interactive
# command (mise skips the check in CI, offline and non-interactive sessions).
# An interactive shell keeps the binary it started with; the following command
# gets the new one. Paired with minimum_release_age = "0s" below, so updates
# are not held back a release cycle.
self_update.auto = "1d"
self_update.minimum_release_age = "0s"

[tools]
age = "1.3.2"
"antigravity-cli" = { version = "latest", lazy = true }
"aqua:astral-sh/ruff" = { version = "latest", lazy = true, lazy_bins = ["ruff"] }
"aqua:koalaman/shellcheck" = { version = "latest", lazy = true, lazy_bins = ["shellcheck"] }
ast-grep = { version = "latest", lazy = true }
bun = "latest"
dive = { version = "latest", lazy = true }
eza = "latest"
fd = "latest"

"forgejo:forgejo-contrib/forgejo-cli" = {
  version = "latest",
  lazy = true,
  lazy_bins = ["fj"],
  os = ["linux"]
}

fzf = "latest"
gh = "latest"
"github:charmbracelet/glow" = "latest"
"github:fujiapple852/trippy" = { version = "latest", lazy = true, lazy_bins = ["trip"] }
"github:ramonvermeulen/whosthere" = { version = "latest", lazy = true, lazy_bins = ["whosthere"] }
"github:simeji/jid" = { version = "latest", lazy = true, lazy_bins = ["jid"] }
"github:tldr-pages/tlrc" = "latest"
"github:tree-sitter/tree-sitter" = { version = "latest", lazy = true, lazy_bins = ["tree-sitter"] }
glab = { version = "latest", lazy = true }
go = { version = "latest", lazy = true, lazy_bins = ["go", "gofmt"] }
"go:github.com/flexphere/gaze/cmd/gaze" = { version = "latest", lazy = true, lazy_bins = ["gaze"] }
lazydocker = { version = "latest", lazy = true }
lazygit = "latest"
node = "lts"
"npm:prettier" = { version = "latest", lazy = true, lazy_bins = ["prettier"] }
prek = { version = "latest", lazy = true, lazy_bins = ["prek"] }
ripgrep = "latest"
rust = { version = "latest", lazy = true }
uv = "latest"
yq = "latest"

[env]
FJ_FALLBACK_HOST = "https://git.3r3.net"
