# Repo-wide checks, run by prek (pre-commit compatible) through mise.
#   mise run check        every tracked file (CI)
#   prek run              staged/changed files only (git hook, after `prek install`)
#   prek run --all-files  same as `mise run check`
#
# Hooks use `language = "mise"`, so tools come from mise.toml and the conf.d
# bundles — mise stays the only place versions are pinned.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  # mise accepts TOML 1.1 multiline inline tables; the 1.0 parsers (this hook,
  # taplo) reject them, and every mise command already parses these files, so
  # validating them here would only produce false failures.
  { id = "check-toml", exclude = '(^|/)mise[^/]*\.toml$' },
  { id = "check-yaml" },
  { id = "destroyed-symlinks" },
  { id = "detect-private-key" },
  # pi writes its JSON without a trailing newline (SettingsManager, CredentialStore,
  # pi-blackhole's saveUnifiedConfig), so this hook would rewrite it on every save.
  # `locks/` is mise's npm provenance: mise.lock pins the sha256 of each
  # aube-lock.yaml, so a trailing-newline fix would invalidate it.
  {
    id = "end-of-file-fixer",
    exclude = {
      glob = [
        "conf.d/ai/dot-pi/agent/{settings,auth}.json",
        "conf.d/ai/dot-pi/agent/pi-blackhole/pi-blackhole-config.json",
        "locks/**",
      ],
    },
  },
  { id = "forbid-new-submodules" },
  { id = "mixed-line-ending", args = ["--fix=lf"], exclude = { glob = "locks/**" } },
  { id = "trailing-whitespace", exclude = { glob = "locks/**" } },
]

[[repos]]
repo = "local"
hooks = [
  # Style lives in .prettierrc (4 spaces, 110 columns; YAML 2 spaces). Markdown
  # keeps its existing line breaks: prettier's default proseWrap is "preserve".
  {
    id = "prettier",
    name = "prettier",
    language = "mise",
    entry = "prettier --write",
    types_or = ["ts", "json", "markdown", "yaml"],
  },
  # `bash` is the tag identify derives from the shebang, so this covers the
  # extensionless task scripts and skips the .zsh files and the sourced
  # dot-config/zsh/*.sh (they are zsh, which shellcheck cannot parse).
  {
    id = "shellcheck",
    name = "shellcheck",
    language = "mise",
    entry = "shellcheck",
    types = ["bash"],
  },
  # Style comes from ruff.toml at the repo root. `ruff check --fix` applies only
  # the safe fixes; anything it leaves behind is a finding, not a formatting nit.
  {
    id = "ruff-format",
    name = "ruff format",
    language = "mise",
    entry = "ruff format",
    types = ["python"],
  },
  {
    id = "ruff-check",
    name = "ruff check",
    language = "mise",
    entry = "ruff check --fix --exit-non-zero-on-fix",
    types = ["python"],
  },
]
