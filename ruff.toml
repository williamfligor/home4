# Ruff config for the skill scripts under conf.d/ai/dot-agents/skills/.
# They are PEP 723 single-file scripts (uv run --script), so there is no
# package layout to configure — just the style the repo already writes.
line-length = 110
# The scripts' own metadata says requires-python = ">=3.10".
target-version = "py310"

[lint]
# Pin the classic default set explicitly: ruff's default selection can widen
# between releases, and findings that appear on a ruff upgrade are noise in a
# repo that is mostly config. Widen this deliberately, not implicitly — the
# broader sets (BLE001 blind except, PLW1510 subprocess check, C408 dict()) do
# have something to say about these scripts.
select = ["E4", "E7", "E9", "F"]
